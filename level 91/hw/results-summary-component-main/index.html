<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Results Summary</title>

  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Hanken Grotesk", sans-serif;
      background: hsl(221, 100%, 96%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      display: flex;
      width: 550px;
      height: 380px;
      background: white;
      border-radius: 25px;
      overflow: hidden;
      box-shadow: 0px 20px 40px rgba(0, 0, 0, 0.1);
    }

    .result {
      width: 50%;
      background: linear-gradient(hsl(252, 100%, 67%), hsl(241, 81%, 54%));
      color: rgb(255, 255, 255);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
      gap: 20px;
      text-align: center;
    }

    .circle {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: linear-gradient(hsla(256, 72%, 46%, 1), hsla(241, 72%, 46%, 0));
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .circle h1 {
      font-size: 50px;
    }

    .circle p {
      color: gray;
    }

    .result h2 {
      opacity: 0.6;
      font-size: 18px;
    }

    .result h3 {
      font-size: 25px;
    }

    .result p {
      font-size: 14px;
      opacity: 0.5;
    }

    .summary {
      width: 50%;
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .summary h3 {
      margin-bottom: 15px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      color: hsl(224, 30%, 27%);
    }

    .item p:last-child {
      color: hsl(224, 30%, 27%);
    }

    .reaction {
      color: hsl(0, 100%, 67%);
      font-size: 15px;
    }

    .memory {
      color: hsl(39, 100%, 56%);
    }

    .verbal {
      color: hsl(166, 100%, 37%);
    }

    .visual {
      color: hsl(234, 85%, 45%);
    }

    .reaction img {
      width: 20px;
      margin-right: -50px;
    }

    .memory img {
      width: 20px;
      margin-right: -50px;
    }

    .verbal img {
      width: 20px;
      margin-right: -55px;
    }

    .visual img {
      width: 20px;
      margin-right: -60px;
    }

    .continue {
      margin-top: auto;
      padding: 12px;
      border: none;
      border-radius: 25px;
      background: hsl(224, 30%, 27%);
      color: #D0D8EB;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="result">
      <h2>Your Result</h2>

      <div class="circle">
        <h1>76</h1>
        <p>of 100</p>
      </div>

      <h3>Great</h3>

      <p>You scored higher than 65% of<br> the people who have taken<br> these tests.</p>
    </div>

    <div class="summary">

      <h3>Summary</h3>

      <div class="item reaction">
        <img src="assets/images/icon-reaction.svg" alt="Reaction">
        <p>Reaction</p>
        <p><strong>80</strong> / 100</p>
      </div>

      <div class="item memory">
        <img src="assets/images/icon-memory.svg" alt="">
        <p>Memory</p>
        <p><strong>92</strong> / 100</p>
      </div>

      <div class="item verbal">
        <img src="assets/images/icon-verbal.svg" alt="">
        <p>Verbal</p>
        <p><strong>61</strong> / 100</p>
      </div>

      <div class="item visual">
        <img src="assets/images/icon-visual.svg" alt="">
        <p>Visual</p>
        <p><strong>72</strong> / 100</p>
      </div>

      <button class="continue">Continue</button>

    </div>

  </div>

</body>

</html>
