<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Position Task</title>

  <style>
    .parent {
      width: 300px;
      height: 300px;
      background: lightgray;
      position: relative;
    }

    .child {
      width: 100px;
      height: 100px;
      background: blue;
      position: absolute;
      bottom: 0;
    }
  </style>
</head>

<body>
  <div class="parent">
    <div class="child"></div>
  </div>
</body>
</html>
