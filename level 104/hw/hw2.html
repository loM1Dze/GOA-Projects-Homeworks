<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, orange 0%, orange 30%, black 150%);
        }

        .moon {
            background-color: orange;
            width: 170px;
            height: 170px;
            border-radius: 50%;
            z-index: 2;
        }

        .sun {
            background-color: yellow;
            width: 170px;
            height: 170px;
            border-radius: 50%;
            position: absolute;
            right: 650px;
            top: 300px;
            z-index: 1;
            animation: move 8s infinite ease;
        }

        @keyframes move {

            20% {
                transform: scale(1) translate(0px, 0px);
                box-shadow: 0 0 0px yellow;
            }

            40% {
                transform: scale(1.2) translate(-27px, -15px);
                box-shadow: 0 0 40px yellow;
            }

            60% {
                transform: scale(1) translate(-33px, -17px);
                box-shadow: 0 0 0px yellow;
            }

            80% {
                transform: scale(1.2) translate(-27px, -15px);
                box-shadow: 0 0 40px yellow;
            }

            100% {
                transform: scale(1) translate(0px, 0px);
                box-shadow: 0 0 0px yellow;
            }
        }
    </style>
</head>

<body>

    <div class="moon"></div>
    <div class="sun"></div>

</body>

</html>
