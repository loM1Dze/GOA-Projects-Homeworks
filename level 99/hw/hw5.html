<!-- 6)შექმენი ღილაკი.
როდესაც მაუსს გადაატარებ (:hover), ღილაკი უნდა გადაიწიოს მარჯვნივ 10px-ით და ქვემოთ 15px-ით translate() გამოყენებით. -->

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Hover Translate</title>

    <style>
        button {
            padding: 10px 20px;
            font-size: 16px;
        }

        button:hover {
            transform: translate(10px, 15px);
        }
    </style>
</head>

<body>

    <button>opsec</button>

</body>

</html>
