<!-- 11)შექმენი ღილაკი.
:hover მდგომარეობაში ელემენტი უნდა გაიზარდოს 1.2-ჯერ ორივე მიმართულებით scale() გამოყენებით. -->

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Scale Hover</title>

    <style>
        button {
            padding: 12px 24px;
            font-size: 16px;
        }

        button:hover {
            transform: scale(1.2);
        }
    </style>
</head>

<body>

    <button>opsec</button>

</body>

</html>
