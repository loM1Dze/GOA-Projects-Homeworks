<!-- 14)შექმენი ღილაკი.
როცა მაუსს მიიტან, 90deg-ით დატრიალდეს. -->

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Rotate Hover</title>

    <style>
        button {
            padding: 12px 24px;
            font-size: 16px;
        }

        button:hover {
            transform: rotate(90deg);
        }
    </style>
</head>

<body>

    <button>opsec</button>

</body>

</html>
