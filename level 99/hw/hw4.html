<!-- 5)შექმენი 200px × 200px კვადრატი.

გადაადგილე:

მარჯვნივ 120px

ქვემოთ 70px
გამოიყენეთ translate() -->

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translate Example</title>

    <style>
        .box {
            width: 200px;
            height: 200px;
            background-color: purple;

            transform: translate(120px, 70px);
        }
    </style>
</head>

<body>

    <div class="box"></div>

</body>

</html>
