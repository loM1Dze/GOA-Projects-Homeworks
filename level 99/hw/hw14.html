<!-- 15)შექმენი დივი.
Hover-ზე გამოიყენე rotateX(60deg). -->

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RotateX Hover</title>

    <style>
        .box {
            width: 150px;
            height: 150px;
            background-color: blue;
        }

        .box:hover {
            transform: rotateX(60deg);
        }
    </style>
</head>

<body>

    <div class="box"></div>

</body>

</html>
