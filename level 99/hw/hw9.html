<!-- 10)შექმენი 200px × 200px ბლოკი.
გაადიდე ელემენტი 1.5-ჯერ ორივე მიმართულებით. -->

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scale Example</title>

    <style>
        .box {
            width: 200px;
            height: 200px;
            background-color: blue;

            transform: scale(1.5);
        }
    </style>
</head>

<body>

    <div class="box"></div>

</body>

</html>
