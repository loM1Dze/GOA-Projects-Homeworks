<!-- 8)შექმენი 150px × 150px კვადრატი.მიეცი ფერი
გამოიყენე scaleX() და გაადიდე ელემენტი ჰორიზონტალურად 2-ჯერ. -->

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScaleX Example</title>

    <style>
        .box {
            width: 150px;
            height: 150px;
            background-color: orange;

            transform: scaleX(2);
        }
    </style>
</head>

<body>

    <div class="box"></div>

</body>

</html>
