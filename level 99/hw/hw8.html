<!-- 9)შექმენი წითელი ბლოკი.
გამოიყენე scaleY() და გაზარდე ელემენტი ვერტიკალურად 1.5-ჯერ. -->

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScaleY Example</title>

    <style>
        .box {
            width: 150px;
            height: 150px;
            background-color: red;

            transform: scaleY(1.5);
        }
    </style>
</head>

<body>

    <div class="box"></div>

</body>

</html>
