<!-- 7)შექმენი ბარათის (card) დიზაინი.
hover-ზე ბარათი უნდა:

ოდნავ აიწიოს ზემოთ (translateY)

დაემატოს ჩრდილი -->

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Hover Effect</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 250px;
            padding: 20px;
            border-radius: 12px;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body>

    <div class="card">
        <h3>opsec</h3>
    </div>

</body>

</html>
