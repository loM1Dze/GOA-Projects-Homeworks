<!-- 13)შექმენი 100x100px კვადრატი.
დაატრიალე 55deg-ით y ღერძზე -->

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RotateY Example</title>

    <style>
        .box {
            width: 100px;
            height: 100px;
            background-color: green;

            transform: rotateY(55deg);
        }
    </style>
</head>

<body>

    <div class="box"></div>

</body>

</html>
