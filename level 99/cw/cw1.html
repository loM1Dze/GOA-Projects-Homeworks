<!-- 2) შექმენით პარაგრაფი სადაც დაწერთ თქვენს სახელს


შენი დავალებაა რომ ელემენტი გადაიტანო 200px ით მარჯვნივ და ჩამოიტანო 450px ითქვემოთ

გამოიყენეთ transform და შესაბამისსი შემოკლებული კუთვნილება -->

<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Transform</title>
    <style>
        p {
            transform: translate(200px, 450px);
        }
    </style>
</head>

<body>

    <p>opsec</p>

</body>

</html>
