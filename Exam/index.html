<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Goal-Oriented Academy • GOA</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Poppins", "Roboto", sans-serif;
            background-color: #000;
            color: white;
        }

        nav {
            position: sticky;
            top: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            padding: 12px;
            border-bottom: 1px solid rgba(0, 255, 136, 0.2);
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        nav ul li a {
            color: #00ff88;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 10px;
            background-color: rgba(0, 128, 0, 0.2);
            transition: all 0.4s ease;
            letter-spacing: 0.5px;
        }

        nav ul li a:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.1);
            letter-spacing: 1.3px;
            text-shadow: 0 0 10px #fff;
        }

        h1 {
            color: #00cc66;
            text-align: center;
            margin: 30px 10px 10px;
            text-shadow: 0 0 10px rgba(0, 255, 100, 0.5);
        }

        h2 {
            color: #66ff99;
            text-align: center;
            margin-top: 40px;
        }

        p {
            margin: 20px auto;
            color: #ccffcc;
            text-align: center;
            font-size: 1.2em;
            max-width: 800px;
            width: 90%;
            line-height: 1.6;
        }

        p strong {
            color: #00ff88;
        }

        img {
            width: 40%;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 0 25px #00cc66;
            display: block;
            margin: 25px auto;
            transition: transform 0.5s ease;
        }

        img:hover {
            transform: scale(1.03);
        }
    </style>
</head>

<body>

    <nav>
        <ul>
            <li><a href="about.html">ჩვენ შესახებ</a></li>
            <li><a href="services.html">სერვისები</a></li>
            <li><a href="contact.html">კონტაქტი</a></li>
        </ul>
    </nav>

    <main>
        <h1>Goal-Oriented Academy • GOA</h1>

        <img src="goa.png" alt="GOA Logo">

        <h2>კეთილი იყოს თქვენი მობრძანება ჩვენს საიტზე!</h2>

        <p>
            ეს არის შესრულებული პროექტი <strong>GOA</strong> შესახებ.
            აქ გაიგებთ ინფორმაციას აკადემიაზე, მის სერვისებსა და კონტაქტების შესახებ.
        </p>
    </main>

</body>

</html>
