<!-- 5)ბურთის ვარდნა

შექმენი ბურთი, რომელიც:

იწყებს translateY(0) პოზიციიდან.
მთავრდება translateY(300px) პოზიციაზე.
ანიმაცია იყოს 1.5s.
გამეორდეს უსასრულოდ.
გამოიყენე ease-in. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .ball {
            width: 50px;
            height: 50px;
            background-color: red;
            border-radius: 50%;
            transform: translateY(0);
            animation-name: drop;
            animation-duration: 1.5s;
            animation-timing-function: ease-in;
            animation-iteration-count: infinite;
        }

        @keyframes drop {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(300px);
            }
        }
    </style>
</head>

<body>

    <div class="ball"></div>

</body>

</html>
