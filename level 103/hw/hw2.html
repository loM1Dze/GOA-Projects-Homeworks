<!-- 3). ტექსტის გამოჩენა დაგვიანებით

შექმენი <h1> ელემენტი.

თავიდან იყოს გამჭვირვალე (opacity: 0).
ბოლოს გახდეს სრულად ხილული.
ანიმაცია დაიწყოს 2 წამის შემდეგ.
დასრულების შემდეგ ტექსტი დარჩეს ხილული. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 {
            opacity: 0;
            animation-name: fadeIn;
            animation-duration: 1s;
            animation-delay: 2s;
            animation-fill-mode: forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <h1>ეს არის დაგვიანებული ტექსტი</h1>

</body>

</html>
