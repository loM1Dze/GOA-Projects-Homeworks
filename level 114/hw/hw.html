<!-- 1)შექმენი გვერდი, სადაც არის ერთი <h1>.

კომპიუტერზე (>768px) ტექსტი იყოს 48px.
ტელეფონზე (<=768px) გახდეს 28px. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Title</title>
    <style>
        h1 {
            font-size: 48px;
        }


        @media (max-width: 768px) {
            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <h1>opsec</h1>

</body>

</html>
