<!-- 2)შექმენი div (300x300).

დიდ ეკრანზე იყოს ლურჯი.
768px-ზე ნაკლებ ეკრანზე გახდეს მწვანე.
480px-ზე ნაკლებ ეკრანზე გახდეს წითელი. -->


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            height: 300px;
            width: 300px;
            background-color: blue;
        }

        @media (max-width: 768px) {
            div {
                background-color: green;
            }
        }

        @media (max-width: 480px) {
            div {
                background-color: red;
            }
        }
    </style>
</head>

<body>
    <div></div>
</body>

</html>
