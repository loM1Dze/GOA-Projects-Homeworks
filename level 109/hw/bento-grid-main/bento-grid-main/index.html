<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | [Challenge Name Here]</title>


  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'DM Sans', sans-serif;
    }

    #parent {
      height: 813px;
      width: 1030px;
      border: 1px solid red;
    }

    .skin {
      background-color: rgb(250, 238, 226);
      grid-column: 1 / span 1;
      grid-row: 1 / span 5;
      justify-content: center;
      padding: 0 25px;
      gap: 15px;
    }

    .skin img {}

    .skin h2 {
      font-size: 40px;
      line-height: 0.9;
      font-weight: 500;
    }

    .fyellow {
      background-color: rgb(255, 204, 105);
      grid-row: 6 / span 10;
      grid-column: 1 / span 1;
    }

    .fpurple {
      background-color: rgb(116, 80, 217);
      grid-row: 2 / span 2;
      grid-column: 1 / span 4;
    }

    .fwhite {
      background-color: rgb(255, 255, 255);
      grid-column: 2 / span 1;
      grid-row: 5 / span 3;
    }

    .swhite {
      background-color: rgb(255, 255, 255);
      grid-column: 2 / 3;
      grid-row: 8 / span 3;
    }

    .syellow {
      background-color: rgb(255, 204, 105);
      grid-column: 3 / 4;
      grid-row: 5 / 8;
    }

    .spurple {
      background-color: rgb(116, 80, 217);
      grid-column: 3 / 5;
      grid-row: 8 / span 3;
    }

    .lpurple {
      background-color: rgb(220, 209, 252);
      grid-column: 4 / 5;
      grid-row: 1 / span 7;
    }

    .same {
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 10px rgb(217, 217, 217);
    }
  </style>
</head>
<div class="parent">
  <div class="same skin">
    <h2>Create and schedule content quicker.</h2>
  </div>
  <div class="same fyellow"></div>
  <div class="same fpurple"></div>
  <div class="same fwhite"></div>
  <div class="same swhite"></div>
  <div class="same syellow"></div>
  <div class="same spurple"></div>
  <div class="same lpurple" style="flex-direction: row;"></div>
</div>

<body>
  <!-- 
  Social Media 10x Faster with AI
  Over 4,000 5-star reviews

  Manage multiple accounts and platforms.

  Maintain a consistent posting schedule.

  Schedule to social media.
  Optimize post timings to publish content at the perfect time for your audience.
  
  Grow followers with non-stop content.

  >56% faster audience growth
  
  

  Write your content using AI. -->


</body>

</html>
