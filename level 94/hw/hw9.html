<!-- 10)შექმენი ფოტო გალერეა.
ყოველ სურათზე მარჯვენა ზედა კუთხეში იყოს "NEW"  absolute პოზიციით. -->


<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Gallery</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        .gallery {
            display: flex;
            gap: 20px;
            padding: 20px;
            justify-content: center;
        }

        .item {
            position: relative;
            width: 200px;
            height: 150px;
        }

        .item img {
            width: 100%;
            height: 100%;
        }

        .new {
            position: absolute;
            top: 10px;
            right: 10px;
            background: red;
            color: white;
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="gallery">

        <div class="item">
            <span class="new">NEW</span>
            <img src="https://via.placeholder.com/200x150" alt="">
        </div>

        <div class="item">
            <span class="new">NEW</span>
            <img src="https://via.placeholder.com/200x150" alt="">
        </div>

        <div class="item">
            <span class="new">NEW</span>
            <img src="https://via.placeholder.com/200x150" alt="">
        </div>

    </div>

</body>

</html>
