<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Card Sale</title>
    <style>
        .card {
            width: 300px;
            position: relative;
            border-radius: 10px;
            overflow: hidden;
        }

        .card img {
            width: 100%;
        }

        .sale {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: red;
            color: white;
            padding: 5px 10px;
            font-weight: bold;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="card">
        <span class="sale">SALE</span>
