<!-- 9)შექმენი საათის მსგავსი დიზაინი:
დიდი წრე → relative
პატარა წრეები → absolute
მოათავსე სხვადასხვა პოზიციაზე -->


<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Clock Design</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f2f2;
        }

        .clock {
            position: relative;
            width: 300px;
            height: 300px;
            border: 8px solid black;
            border-radius: 50%;
            background: white;
        }

        .dot {
            position: absolute;
            width: 20px;
            height: 20px;
            background: red;
            border-radius: 50%;
        }

        .d1 {
            top: 10px;
            left: 140px;
        }

        .d2 {
            top: 140px;
            right: 10px;
        }

        .d3 {
            bottom: 10px;
            left: 140px;
        }

        .d4 {
            top: 140px;
            left: 10px;
        }

        .d5 {
            top: 60px;
            left: 40px;
        }

        .d6 {
            top: 60px;
            right: 40px;
        }

        .d7 {
            bottom: 60px;
            left: 40px;
        }

        .d8 {
            bottom: 60px;
            right: 40px;
        }
    </style>
</head>

<body>

    <div class="clock">
        <div class="dot d1"></div>
        <div class="dot d2"></div>
        <div class="dot d3"></div>
        <div class="dot d4"></div>
        <div class="dot d5"></div>
        <div class="dot d6"></div>
        <div class="dot d7"></div>
        <div class="dot d8"></div>
    </div>

</body>

</html>
