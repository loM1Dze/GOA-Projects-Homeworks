<!-- 1)შექმენი div 400px x 400px წითელი, რომელსაც ექნება position: relative;.
შიგნით ჩასვი პატარა ლურჯი კვადრატი position: absolute;-ით და მოათავსე:
ზედა მარჯვენა კუთხეში
ზომა: 50x50px -->

<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Absolute Position Example</title>
    <style>
        .parent {
            width: 400px;
            height: 400px;
            background-color: red;
            position: relative;
        }

        .child {
            width: 50px;
            height: 50px;
            background-color: blue;
            position: absolute;
            top: 0;
            right: 0;
        }
    </style>
</head>

<body>

    <div class="parent">
        <div class="child"></div>
    </div>

</body>

</html>
