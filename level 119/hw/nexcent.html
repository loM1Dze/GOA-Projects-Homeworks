<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');

        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body {
            font-family: "Inter", sans-serif;
            height: 100vh;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 21px 100px;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        ul {
            display: flex;
            align-items: center;
            list-style: none;
            gap: 20px;
            color: #4D4D4D;
            font-size: 16px;
            font-weight: 500;
        }

        button {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 133px;
            height: 36px;
            border: none;
            background-color: rgb(76, 175, 79);
            color: white;
            font-weight: 500;
            font-size: 14px;
            border-radius: 5px;
            gap: 10px;
        }

        #burger {
            display: none;
        }

        @media (max-width: 1000px) {
            header {
                padding: 21px 30px;
            }

            #logo {
                width: 120px;
            }
        }

        @media (max-width: 740px) {
            nav {
                display: none;
            }

            #burger {
                display: block;
            }
        }
    </style>
</head>

<body>
    <header>
        <img id="logo" src="./images/nexcent.png" alt="">

        <nav>
            <ul>
                <li>Home</li>
                <li>Features</li>
                <li>Community</li>
                <li>Blog</li>
                <li>Pricing</li>
            </ul>

            <button>Register Now <img src="./images/vector.png" alt="" style="width:16px;"></button>
        </nav>

        <img id="burger" src="./images/Menu.png" alt="">
    </header>
</body>

</html>
