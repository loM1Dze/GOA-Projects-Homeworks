<!-- 10)შექმენი Login ფორმა.
focus-ისას:

Input-ის border შეიცვალოს.
Input ოდნავ გაიზარდოს.
Placeholder-ის ფერი შეიცვალოს. -->


<html>

<head>
    <meta charset="UTF-8" />

    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
        }

        .form {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            width: 280px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 2px solid transparent;
            border-radius: 6px;
            outline: none;

            transition: transform 0.3s ease,
                border 0.3s ease,
                color 0.3s ease;
        }

        input::placeholder {
            color: gray;
            transition: color 0.3s ease;
        }

        input:focus {
            border: 2px solid yellow;
            transform: scale(1.05);
        }

        input:focus::placeholder {
            color: yellow;
        }
    </style>
</head>

<body>

    <div class="form">
        <input type="text" placeholder="Username">
        <input type="password" placeholder="Password">
    </div>

</body>

</html>
