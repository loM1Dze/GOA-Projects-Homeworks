<html lang="en">
<head>
<meta charset="UTF-8">
<title>Positions and z-index</title>

<style>

    .box{
        width: 260px;
        height: 260px;
        background: #eee;
        position: relative;
    }

    .b1{
        width: 120px;
        height: 120px;
        position: absolute;
    }

    .purple{
        background: purple;
        top: 20px;
        left: 30px;
        z-index: 2;
    }

    .red{
        background: red;
        top: 50px;
        left: 60px;
        z-index: 1;
    }

    .green{
        background: green;
        top: 85px;
        left: 95px;
        z-index: 3;
    }

</style>
</head>

<body>

    <div class="box">
        <div class="b1 purple"></div>
        <div class="b1 red"></div>
        <div class="b1 green"></div>
    </div>

</body>
</html>
