<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Positions and z-index</title>

    <style>
        .box {
            width: 500px;
            height: 500px;
            background: #eee;
            position: relative;
        }

        .b1 {
            width: 120px;
            height: 120px;
            position: absolute;
        }

        .black {
            background: black;
        }

        .blue{
            background: blue;
            left: 40px;
            top: 40px;
            z-index: 1;
        }

        .green{
            background: green;
            left: 90px;
            top: 70px;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="b1 black"></div>
        <div class="b1 blue"></div>
        <div class="b1 Green"></div>
    </div>
</body>

</html>
