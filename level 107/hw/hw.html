<!-- 1)თქვენი დავალება იქნება კომენტარის სახით ახსენით თუ რაში ვიყენებთ % , რა არის fr და რა არის repeat() -->

<!-- % ებს ვიყენებთ საიტზე ელემენტებისთვის ზომის შესარჩევად მაგრამ არ არის ფიქსირებული როგორც px, ისინი რესპონსიულია -->

<!-- ფრაქციებს (fr) ვიყენებთ იმშემთხვევაში როცა გვინდა ერთნაირი ზომის რამდენიმე როუს ან ქოლუმნის შექმნა გვინდა -->

<!-- repeat() ფუნქციას ვიყენებთ ქოლუმნების და როუების შესაქმნელად, მაგალითად გვინდა მონაცემთა ბაზასავით დიდი ცხრილი, ამისთვის
ვიყენებთ რიფით ფუნქციას რომ არ მოგვიწიოს ხელით წერა თითოეულის და მივუთითოთ რამდენჯერ გაიმეოროს -->






<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr 2.2fr 1.2fr;
            grid-template-rows: repeat(3, 1fr);
            background: black;
            width: 800px;
            height: 400px;
            gap: 10px;
            border: 10px solid black;
        }

        .red    { background: #f04e45; }
        .blue   { background: #22c3d3; }
        .orange { background: #dcb372; }
        .white  { background: #ffffff; }

        
        .box1 {
            grid-area: 1 / 1 / 3 / 2;
        }

        .box2 {
            grid-area: 1 / 2 / 2 / 3;
        }

        .box3 {
            grid-area: 1 / 3 / 2 / 5;
        }

        .box4 {
            grid-area: 3 / 1 / 4 / 2;
        }

        .box5 {
            grid-area: 2 / 2 / 3 / 3;
        }

        .box6 {
            grid-area: 2 / 3 / 3 / 4;
        }

        .box7 {
            grid-area: 3 / 2 / 4 / 3;
        }

        .box8 {
            grid-area: 3 / 3 / 4 / 4;
        }

        .box9 {
            grid-area: 2 / 4 / 4 / 5;
        }
    </style>
</head>

<body>
    <div class="grid">
        <div class="red box1"></div>
        <div class="blue box2"></div>
        <div class="orange box3"></div>
        <div class="white box4"></div>
        <div class="orange box5"></div>
        <div class="white box6"></div>
        <div class="red box7"></div>
        <div class="blue box8"></div>
        <div class="red box9"></div>
    </div>
</body>

</html>
