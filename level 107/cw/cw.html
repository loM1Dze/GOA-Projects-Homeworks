<!-- 1)შექმენით გრიდი რომელშიც იქნება სამი როუ და სამი ქოლუმნი (ტოლი კუბიკები)

შენი დავალებაა ამ ყველა კუბიკში შექმნა პატარა წითელი დივები ზომებით -- 50% x 50%

შენი დავალებაა რომ მთლიანი გრიდი მოაქციო მშობელი ელემენტის ქვემოთ მარჯვენა მხარეს

ასევე კუბიკებში მყოფი დივები მოაქციე კუბიკის ზემოთ მარჯვენა მხარეს

მიეცი ერთ რომელიმე კუბიკს შემდეგი პოზიცია თავის კუთვნილ კუბიკში -- მოაქციე კუბიკის ქვემოთ მარცხენა მხარეს -->




<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>

    <style>
        .parent {
            width: 500px;
            height: 500px;
            border: 2px solid black;

            display: grid;
            justify-content: end;
            align-content: end;
        }

        .grid {
            width: 300px;
            height: 300px;

            display: grid;
            grid-template-columns: 100px 100px 100px;
            grid-template-rows: 100px 100px 100px;

            justify-items: end;
            align-items: start;
        }

        .red {
            width: 50px;
            height: 50px;
            background-color: red;
        }

        .redd {
            justify-self: start;
            align-self: end;
        }
    </style>
</head>

<body>

    <div class="parent">
        <div class="grid">

            <div class="red"></div>
            <div class="red"></div>
            <div class="red"></div>

            <div class="red"></div>
            <div class="red redd"></div>
            <div class="red"></div>

            <div class="red"></div>
            <div class="red"></div>
            <div class="red"></div>

        </div>
    </div>

</body>
</html>
