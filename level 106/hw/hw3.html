<!-- 6)იგივე კონტეინერს  მიეცი :


height: 40px
რიგის სიმაღლე 120px

დავალება:
გამოიყენე: align items

start
center
end -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Align Items</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: 120px 120px 120px;
            grid-template-rows: 120px;

            align-items: center; /* იგივეა როგორც მეორე სავარჯიშოში align-content მაგრამ განსხვავება ის არის რომ ეს გრიდში მყოფ ელემენტებზე ახდებს გავლენას და ამოძრავებს Y ღერძზე */
        }

        .item {
            width: 60px;
            height: 40px;
            background-color: red;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>

</body>

</html>
