<!-- Justify-content (ჰორიზონტალური გასწორება)
ეს თვისება განაგებს იმას, თუ როგორ განლაგდნენ ელემენტები ჰორიზონტალურად (მარცხნიდან მარჯვნივ).

მისი საშუალებით შეგიძლია ელემენტები ერთად მოაქციო ცენტრში, მიატყუპო მარცხენა/მარჯვენა მხარეს, ან მათ შორის თანაბარი ცარიელი სივრცეები დატოვო. -->

<!-- Align-items (ვერტიკალური გასწორება)
ეს თვისება განაგებს იმას, თუ როგორ განლაგდნენ ელემენტები ვერტიკალურად (ზემოდან ქვემოთ).

მისი საშუალებით შეგიძლია სხვადასხვა სიმაღლის ელემენტები გაასწორო ზუსტად შუა ხაზზე (ცენტრში), აიტანო ზედა ნაწილში ან ჩამოიტანო სულ ბოლოში. -->

<!-- Justify-content: space-between

        Align-items: center -->


<!-- 2)კომენტარის სახით ახსენით რა არის ALIG/ JUSTIFY ITEMS და როგორ მუშაობს ის --- მოიყვანე მაგალით რაიმე მცირე დიზაინით -->

<!-- justify-items (ჰორიზონტალური გასწორება უჯრის შიგნით)
ეს თვისება განსაზღვრავს, თუ როგორ განლაგდეს ელემენტი თავისივე უჯრის (Grid) შიგნით ჰორიზონტალურად (მარცხნიდან მარჯვნივ).

მაგალითად, თუ უჯრა დიდია და შიგნით პატარა ტექსტი ან ფოტო დევს, justify-items: center-ით ეს ფოტო ზუსტად უჯრის შუაში ჩაჯდება ჰორიზონტალურად, ხოლო start-ით — მარცხენა კუთხეში მიეტყუპება. -->










<!-- 3)შექმენი კონტეინერი:

display: grid
grid-template-columns:100px 100px 100px;
width: 700px;
height: 250px;

დავალება:
შეცვალე justify-content შემდეგი მნიშვნელობებით:

start
center
end

კითხვა: როგორ იცვლება მთელი გრიდის მდებარეობა? -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Justify Content</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: 100px 100px 100px;
            width: 700px;
            height: 250px;

            justify-content: center;  /* ამოძრავებს მთლიან გრიდს დივში x ღერძზე */
        }

        .item {
            background-color: red;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>

</body>

</html>
