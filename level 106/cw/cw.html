<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>

    <style>
        .parent {
            width: 600px;
            height: 600px;
            border: 3px solid black;
            display: grid;

            grid-template-columns: 100px 100px 100px 100px 100px 100px;
            grid-template-rows: 100px 100px 100px 100px 100px 100px;
        }

        .box {
            background-color: red;
            
            /* 1st */
        /* grid-row-start: 4;
            grid-row-end: 7;

            grid-column-start: 3;
            grid-column-end: 6; */

            /* 2nd */
         /* grid-row: 4 / 7;
            grid-column: 3 / 6;  */

            /* 3rd */
            grid-area: 4 / 3 / 7 / 6;

        }
    </style>
</head>

<body>

    <div class="parent">
        <div class="box"></div>
    </div>

</body>

</html>
