ამ მშობელ ელემენტშ შექმენით 4 ცალი ტოლი სიგანის სვეტი(column) და სამი ცალი განსხვავებული სიმაღლის რიგი(row) ისე რომ 800 px ში ჩატიოთ

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>

    <style>
        .parent {
            width: 800px;
            height: 800px;
            border: 3px solid black;
            display: grid;

            grid-template-columns: 200px 200px 200px 200px;
            grid-template-rows: 200px 300px 300px;
        }
    </style>
</head>

<body>

    <div class="parent"></div>

</body>

</html>
