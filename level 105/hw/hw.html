<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <style>
    .grid {
      display: grid;
      grid-template-rows: 120px 160px 120px;
      grid-template-columns: 125px 250px 125px;
      gap: 10px;
      padding: 10px;
      background: #fcdb7c;
      width: 520px;
      height: 420px;

    }
    .blue   { background: #7bb0ff; grid-area: 1 / 1 / 2 / 4; }
    .orange { background: #ff8b4d; grid-area: 3 / 1 / 4 / 4; }
    .red1   { background: #ff5252; grid-area: 2 / 1 / 3 / 2; }
    .green  { background: #83f28f; grid-area: 2 / 2 / 3 / 3; }
    .red2   { background: #ff5252; grid-area: 2 / 3 / 3 / 4; }
  </style>

  <div class="grid">
    <div class="blue"></div>
    <div class="red1"></div>
    <div class="green"></div>
    <div class="red2"></div>
    <div class="orange"></div>
  </div>
</body>

</html>
