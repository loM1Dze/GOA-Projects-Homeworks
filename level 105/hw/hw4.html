<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .grid {
            display: grid;
            grid-template-rows: 120px 140px 120px;
            grid-template-columns: 140px 110px 140px 110px 140px;
            gap: 12px;
            background: #3a3a3a; 
            padding: 12px;       
        }

        .red    { background: #f04e45; }
        .blue   { background: #22c3d3; }
        .orange  { background: #dcb372; }
        .white  { background: #ffffff; }

        .box1 { grid-area: 1 / 1 / 3 / 2; } 
        .box2 { grid-area: 1 / 2 / 2 / 5; } 
        .box3 { grid-area: 1 / 4 / 2 / 6; } 
        .box4 { grid-area: 3 / 1 / 4 / 2; } 
        .box5 { grid-area: 2 / 2 / 3 / 3; } 
        .box6 { grid-area: 2 / 3 / 3 / 5; } 
        .box7 { grid-area: 2 / 5 / 4 / 6; } 
        .box8 { grid-area: 3 / 2 / 4 / 4; } 
        .box9 { grid-area: 3 / 4 / 4 / 5; } 
    </style>
</head>
<body>

    <div class="grid">
        <div class="red box1"></div>
        <div class="blue box2"></div>
        <div class="orange box3"></div>
        <div class="white box4"></div>
        <div class="orange box5"></div>
        <div class="white box6"></div>
        <div class="red box7"></div>
        <div class="red box8"></div>
        <div class="blue box9"></div>
    </div>

</body>
</html>
