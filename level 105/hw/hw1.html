<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <style>
    .grid {
      display: grid;
      grid-template-rows: 150px 150px;
      grid-template-columns: 300px 150px 150px;
      gap: 10px;
      background: #ffffff;
      color: white;
    }
    .a      {border-radius: 4px; padding: 10px;}
    .pink   {background: #e61c5d; grid-area: 1 / 1 / 3 / 2;}
    .orange {background: #f99f1b; grid-area: 1 / 2 / 2 / 4;}
    .purple {background: #a63db8; grid-area: 2 / 2 / 3 / 3;}
    .grey   {background: #536673; grid-area: 2 / 3 / 3 / 4;}
  </style>

  <div class="grid">
    <div class="a pink">1</div>
    <div class="a orange">2</div>
    <div class="a purple">3</div>
    <div class="a grey">4</div>
  </div>
</body>

</html>
