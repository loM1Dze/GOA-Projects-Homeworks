<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        .grid {
            display: grid;
            grid-template-rows: 130px 160px 130px;
            grid-template-columns: 135px 135px 135px;
            gap: 15px;
            background: #ffffff;
        }
        .box1 {background: #dc0d2a; grid-area: 1 / 1 / 2 / 2;}
        .box2 {background: #dc0d2a; grid-area: 1 / 2 / 2 / 4;}
        .box3 {background: #dc0d2a; grid-area: 2 / 1 / 3 / 3;}
        .box4 {background: #dc0d2a; grid-area: 2 / 3 / 4 / 4;}
        .box5 {background: #dc0d2a; grid-area: 3 / 1 / 4 / 2;}
        .box6 {background: #dc0d2a; grid-area: 3 / 2 / 4 / 3;}
    </style>

    <div class="grid">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
        <div class="box4"></div>
        <div class="box5"></div>
        <div class="box6"></div>
    </div>
</body>

</html>
