<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .grid {
            display: grid;
            grid-template-rows: 120px 120px 120px;
            grid-template-columns: 120px 150px 150px 120px;
            gap: 12px;
            background: #1e2343; 
            padding: 12px;       
        }

        .green  { background: #61b846; }
        .red    { background: #e32a2a; }
        .yellow { background: #f9a01b; }

        .box1 { grid-area: 1 / 1 / 4 / 2; } 
        .box2 { grid-area: 1 / 2 / 2 / 4; } 
        .box3 { grid-area: 1 / 4 / 2 / 5; } 
        .box4 { grid-area: 2 / 2 / 3 / 3; } 
        .box5 { grid-area: 2 / 3 / 3 / 4; } 
        .box6 { grid-area: 3 / 2 / 4 / 3; } 
        .box7 { grid-area: 3 / 3 / 4 / 4; } 
        .box8 { grid-area: 2 / 4 / 4 / 5; } 
    </style>
</head>
<body>

    <div class="grid">
        <div class="green box1"></div>
        <div class="green box2"></div>
        <div class="red box3"></div>
        <div class="yellow box4"></div>
        <div class="red box5"></div>
        <div class="red box6"></div>
        <div class="yellow box7"></div>
        <div class="green box8"></div>
    </div>

</body>
</html>
